name: Check

# Dev-only verification (lint + a headless-browser smoke test) — the site
# itself still has no build step; this doesn't produce anything that gets
# deployed, it just catches regressions before they reach GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
